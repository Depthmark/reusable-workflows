# ─────────────────────────────────────────────────────────────────────────────
# Release Please: Automated release management
#
# Creates release PRs from conventional commits, and publishes GitHub releases
# when merged. Callers reference reusable workflows by tag (e.g., @v1.0.0).
#
# Supply-chain hardening:
#   - release-please-action pinned to commit SHA
#   - Authentication via github-sts (short-lived OIDC tokens, no PATs)
#   - Pinned runner images (ubuntu-24.04)
#   - StepSecurity harden-runner for runtime monitoring
#   - Minimal permissions scoped per-job
# ─────────────────────────────────────────────────────────────────────────────
---
name: Release Please

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions: {}

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - uses: Depthmark/github-sts-action@11e9b4095d2f3033d0ee7e82bb9ac6a7bcbc9b48 # v0.2.0
        id: sts
        with:
          sts-url: https://github-sts.adelisle.com
          scope: Depthmark/reusable-workflows
          identity: release
          app: depthmark-release-bot

      - name: Run Release Please
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          token: ${{ steps.sts.outputs.token }}
