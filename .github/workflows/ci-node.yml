# ─────────────────────────────────────────────────────────────────────────────
# Reusable CI workflow for Node.js (TypeScript) projects
#
# Runs lint, test, build, audit, and (optionally) Docker build jobs in parallel.
#
# Usage:
#   jobs:
#     ci:
#       uses: Depthmark/reusable-workflows/.github/workflows/ci-node.yml@main
#       with:
#         node-version: "22"
#
# Supply-chain hardening:
#   - All actions pinned to commit SHA (immutable references)
#   - No ${{ }} expressions in run: blocks (prevents script injection)
#   - persist-credentials: false on all checkouts
#   - All inputs validated against safe character sets
#   - Pinned runner images (ubuntu-24.04)
#   - StepSecurity harden-runner for runtime monitoring
#   - Minimal permissions scoped per-job
# ─────────────────────────────────────────────────────────────────────────────
---
name: CI Node

on:
  workflow_call:
    inputs:
      node-version:
        description: "Node.js version to use (e.g., 22, 22.x, lts/*)"
        type: string
        default: "22"
      test-script:
        description: "npm script to run for tests (e.g., test, test:unit)"
        type: string
        default: "test"
      test-flags:
        description: "Extra flags appended to the test script (e.g., -- --coverage --verbose)"
        type: string
        default: ""
      lint-script:
        description: "npm script to run for linting"
        type: string
        default: "lint"
      build-script:
        description: "npm script to run for building"
        type: string
        default: "build"
      audit-level:
        description: "npm audit severity threshold (low, moderate, high, critical, none to skip)"
        type: string
        default: "high"
      artifact-retention-days:
        description: "Number of days to retain test artifacts"
        type: number
        default: 30
      docker-build:
        description: "Run a Docker build (no push) to validate the Dockerfile"
        type: boolean
        default: false
      docker-context:
        description: "Docker build context path"
        type: string
        default: "."
      docker-file:
        description: "Path to Dockerfile (relative to context)"
        type: string
        default: "Dockerfile"

permissions: {}

jobs:
  # ───────────────────────────────────────────────────────────────────────────
  validate-inputs:
    name: Validate Inputs
    runs-on: ubuntu-24.04
    permissions: {}
    env:
      NODE_VERSION: ${{ inputs.node-version }}
      TEST_SCRIPT: ${{ inputs.test-script }}
      LINT_SCRIPT: ${{ inputs.lint-script }}
      BUILD_SCRIPT: ${{ inputs.build-script }}
      AUDIT_LEVEL: ${{ inputs.audit-level }}
    steps:
      - name: Validate node-version
        run: |
          if ! [[ "$NODE_VERSION" =~ ^[a-zA-Z0-9.*/-]+$ ]]; then
            echo "::error::node-version contains invalid characters: ${NODE_VERSION}"
            exit 1
          fi

      - name: Validate script names
        run: |
          for name in "$TEST_SCRIPT" "$LINT_SCRIPT" "$BUILD_SCRIPT"; do
            if ! [[ "$name" =~ ^[a-zA-Z0-9:_-]+$ ]]; then
              echo "::error::Script name contains invalid characters: ${name}"
              exit 1
            fi
          done

      - name: Validate audit-level
        run: |
          case "$AUDIT_LEVEL" in
            low|moderate|high|critical|none) echo "Audit level: ${AUDIT_LEVEL}" ;;
            *) echo "::error::Invalid audit-level: ${AUDIT_LEVEL} (must be low, moderate, high, critical, or none)"; exit 1 ;;
          esac

  # ───────────────────────────────────────────────────────────────────────────
  lint:
    name: Lint
    needs: [validate-inputs]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@f808768d1510423e83855289c910610ca9b43176 # v2.17.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        env:
          LINT_SCRIPT: ${{ inputs.lint-script }}
        run: npm run "$LINT_SCRIPT"

  # ───────────────────────────────────────────────────────────────────────────
  test:
    name: Test
    needs: [validate-inputs]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@f808768d1510423e83855289c910610ca9b43176 # v2.17.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        env:
          TEST_SCRIPT: ${{ inputs.test-script }}
          TEST_FLAGS: ${{ inputs.test-flags }}
        run: |
          # TEST_FLAGS is intentionally unquoted for word splitting into arguments.
          # This value comes from the calling workflow YAML (trusted).
          # shellcheck disable=SC2086
          npm run "$TEST_SCRIPT" -- ${TEST_FLAGS} 2>&1 | tee test-output.txt

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: test-results
          path: |
            test-output.txt
            coverage/
          retention-days: ${{ inputs.artifact-retention-days }}

  # ───────────────────────────────────────────────────────────────────────────
  build:
    name: Build
    needs: [validate-inputs]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@f808768d1510423e83855289c910610ca9b43176 # v2.17.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          BUILD_SCRIPT: ${{ inputs.build-script }}
        run: npm run "$BUILD_SCRIPT"

  # ───────────────────────────────────────────────────────────────────────────
  audit:
    name: Audit
    needs: [validate-inputs]
    if: ${{ inputs.audit-level != 'none' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@f808768d1510423e83855289c910610ca9b43176 # v2.17.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        env:
          AUDIT_LEVEL: ${{ inputs.audit-level }}
        run: npm audit --audit-level="$AUDIT_LEVEL"

  # ───────────────────────────────────────────────────────────────────────────
  docker-build:
    name: Docker Build
    if: ${{ inputs.docker-build }}
    needs: [validate-inputs]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      CONTEXT: ${{ inputs.docker-context }}
      DOCKERFILE: ${{ inputs.docker-file }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@f808768d1510423e83855289c910610ca9b43176 # v2.17.0
        with:
          egress-policy: audit

      - name: Validate context path
        run: |
          if echo "$CONTEXT" | grep -qE '(^|/)\.\.(/|$)'; then
            echo "::error::docker-context must not contain path traversal (..)"
            exit 1
          fi
          if [[ "$CONTEXT" == /* ]]; then
            echo "::error::docker-context must be a relative path"
            exit 1
          fi
          if ! [[ "$CONTEXT" =~ ^[a-zA-Z0-9._/-]+$ ]]; then
            echo "::error::docker-context contains invalid characters"
            exit 1
          fi

      - name: Validate dockerfile path
        run: |
          if echo "$DOCKERFILE" | grep -qE '(^|/)\.\.(/|$)'; then
            echo "::error::docker-file must not contain path traversal (..)"
            exit 1
          fi
          if [[ "$DOCKERFILE" == /* ]]; then
            echo "::error::docker-file must be a relative path"
            exit 1
          fi
          if ! [[ "$DOCKERFILE" =~ ^[a-zA-Z0-9._/-]+$ ]]; then
            echo "::error::docker-file contains invalid characters"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

      - name: Build (no push)
        uses: docker/build-push-action@d08e5c354a6adb9ed34480a06d141179aa583294 # v7.0.0
        with:
          context: ${{ inputs.docker-context }}
          file: ${{ inputs.docker-context }}/${{ inputs.docker-file }}
          push: false
          load: true
