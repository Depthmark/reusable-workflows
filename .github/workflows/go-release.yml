# ─────────────────────────────────────────────────────────────────────────────
# Reusable workflow: Build and release Go packages with GoReleaser
#
# Checks out a release tag, sets up Go, optionally installs cosign for keyless
# artifact signing, and runs the caller repository's GoReleaser configuration.
#
# Usage:
#   jobs:
#     go:
#       uses: Depthmark/reusable-workflows/.github/workflows/go-release.yml@main
#       with:
#         tag_name: ${{ needs.release.outputs.tag_name }}
#       permissions:
#         contents: write
#         id-token: write
#         attestations: write
#         artifact-metadata: write
#
# The caller repository must provide a GoReleaser v2 configuration. It controls
# build targets, archives, checksums, changelog generation, and signing.
#
# Supply-chain hardening:
#   - tag_name and version inputs validated against strict regexes before use
#   - Configuration paths validated against path traversal
#   - No ${{ }} expressions in run: blocks (prevents script injection)
#   - All actions pinned to commit SHA (immutable references)
#   - persist-credentials: false on checkout
#   - Go dependency caching disabled in the publishing job
#   - Cosign keyless signing via Sigstore OIDC supported
#   - SLSA provenance covers every artifact in the GoReleaser checksum file
#   - Pinned runner image (ubuntu-24.04)
#   - StepSecurity harden-runner for runtime monitoring
#   - Minimal permissions scoped to the release job
#   - GitHub environment protection rules supported
# ─────────────────────────────────────────────────────────────────────────────
---
name: Go Release

on:
  workflow_call:
    inputs:
      tag_name:
        description: "Release tag (e.g., v1.2.3)"
        required: true
        type: string
      go-version-file:
        description: "Path to the file containing the Go version"
        type: string
        default: "go.mod"
      goreleaser-config:
        description: "Path to the GoReleaser v2 configuration"
        type: string
        default: ".goreleaser.yaml"
      goreleaser-version:
        description: "GoReleaser version"
        type: string
        default: "v2.15.2"
      install-cosign:
        description: "Install cosign for signing configured GoReleaser artifacts"
        type: boolean
        default: true
      attest:
        description: "Generate SLSA provenance for artifacts in the checksum file"
        type: boolean
        default: true
      checksum-file:
        description: "GoReleaser checksum file used to identify attestation subjects"
        type: string
        default: "dist/checksums.txt"
      environment:
        description: "GitHub environment for release protection rules"
        type: string
        default: "release"
    outputs:
      version:
        description: "Released version without the v or component-v prefix"
        value: ${{ jobs.release.outputs.version }}
      artifacts:
        description: "JSON metadata for artifacts produced by GoReleaser"
        value: ${{ jobs.release.outputs.artifacts }}
      attestation-url:
        description: "URL of the GitHub artifact attestation"
        value: ${{ jobs.release.outputs.attestation-url }}

permissions: {}

jobs:
  release:
    name: Release Go Package
    runs-on: ubuntu-24.04
    environment: ${{ inputs.environment }}
    permissions:
      contents: write # Create or update the GitHub release and its assets
      id-token: write # Keyless artifact signing via Sigstore OIDC
      attestations: write # Persist SLSA provenance in GitHub
      artifact-metadata: write # Record attested artifact metadata
    outputs:
      version: ${{ steps.version.outputs.version }}
      artifacts: ${{ steps.goreleaser.outputs.artifacts }}
      attestation-url: ${{ steps.attest.outputs.attestation-url }}
    env:
      TAG_NAME: ${{ inputs.tag_name }}
      GO_VERSION_FILE: ${{ inputs.go-version-file }}
      GORELEASER_CONFIG: ${{ inputs.goreleaser-config }}
      GORELEASER_VERSION: ${{ inputs.goreleaser-version }}
      CHECKSUM_FILE: ${{ inputs.checksum-file }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@f808768d1510423e83855289c910610ca9b43176 # v2.17.0
        with:
          egress-policy: audit

      # ── Input validation ──────────────────────────────────────────────────
      - name: Validate inputs
        run: |
          if ! [[ "$TAG_NAME" =~ ^([a-zA-Z0-9]([a-zA-Z0-9._-]*[a-zA-Z0-9])?-)?v[0-9]+\.[0-9]+\.[0-9]+(-(alpha|beta|rc|dev)\.[0-9]+)?(\+[a-zA-Z0-9.]+)?$ ]]; then
            echo "::error::Invalid tag format: '${TAG_NAME}'"
            echo "Expected: v1.2.3, component-v1.2.3, or v1.2.3-rc.1"
            exit 1
          fi

          if ! [[ "$GORELEASER_VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::goreleaser-version must be an exact v-prefixed version"
            exit 1
          fi

          for path in "$GO_VERSION_FILE" "$GORELEASER_CONFIG" "$CHECKSUM_FILE"; do
            if echo "$path" | grep -qE '(^|/)\.\.(/|$)'; then
              echo "::error::Paths must not contain path traversal (..)"
              exit 1
            fi
            if [[ "$path" == /* ]]; then
              echo "::error::Paths must be relative to the repository root"
              exit 1
            fi
            if ! [[ "$path" =~ ^[a-zA-Z0-9._/-]+$ ]]; then
              echo "::error::Paths contain invalid characters"
              exit 1
            fi
          done

      # ── Setup ─────────────────────────────────────────────────────────────
      - name: Checkout release tag
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.tag_name }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify required files
        run: |
          if [ ! -f "$GO_VERSION_FILE" ]; then
            echo "::error::Go version file not found: ${GO_VERSION_FILE}"
            exit 1
          fi
          if [ ! -f "$GORELEASER_CONFIG" ]; then
            echo "::error::GoReleaser configuration not found: ${GORELEASER_CONFIG}"
            exit 1
          fi

      - name: Compute version
        id: version
        run: |
          if [[ "$TAG_NAME" == *-v* ]]; then
            VERSION="${TAG_NAME##*-v}"
          else
            VERSION="${TAG_NAME#v}"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.0.2
        with:
          go-version-file: ${{ inputs.go-version-file }}
          cache: false

      - name: Install cosign
        if: ${{ inputs.install-cosign }}
        uses: sigstore/cosign-installer@cad07c2e89fa2edd6e2d7bab4c1aa38e53f76003 # v4.1.1

      # ── Release ───────────────────────────────────────────────────────────
      - name: Run GoReleaser
        id: goreleaser
        uses: goreleaser/goreleaser-action@ec59f474b9834571250b370d4735c50f8e2d1e29 # v7.0.0
        with:
          distribution: goreleaser
          version: ${{ inputs.goreleaser-version }}
          args: release --clean --config ${{ env.GORELEASER_CONFIG }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ── Attestation ───────────────────────────────────────────────────────
      - name: Validate release checksums
        if: ${{ inputs.attest }}
        run: |
          if [ ! -s "$CHECKSUM_FILE" ]; then
            echo "::error::Checksum file not found or empty: ${CHECKSUM_FILE}"
            echo "Configure checksum.name_template in .goreleaser.yaml or set checksum-file."
            exit 1
          fi
          if ! grep -qE '^([a-fA-F0-9]{64}|[a-fA-F0-9]{128}) [ *].+' "$CHECKSUM_FILE"; then
            echo "::error::Checksum file does not contain SHA-256 or SHA-512 artifact entries"
            exit 1
          fi

      - name: Generate artifact provenance
        id: attest
        if: ${{ inputs.attest }}
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: ${{ inputs.checksum-file }}

      # ── Summary ───────────────────────────────────────────────────────────
      - name: Create success summary
        env:
          VERSION: ${{ steps.version.outputs.version }}
          ATTESTATION_URL: ${{ steps.attest.outputs.attestation-url }}
        run: |
          {
            echo "## Go Package Released Successfully!"
            echo ""
            echo "**Repository:** ${GITHUB_REPOSITORY}"
            echo "**Version:** ${VERSION}"
            echo "**Tag:** ${TAG_NAME}"
            echo ""
            echo "Release assets and checksums were generated by GoReleaser."
            if [ -n "$ATTESTATION_URL" ]; then
              echo ""
              echo "**Provenance:** ${ATTESTATION_URL}"
              echo ""
              echo "Verify a downloaded artifact with:"
              echo '```bash'
              echo "gh attestation verify <artifact> --repo ${GITHUB_REPOSITORY}"
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
